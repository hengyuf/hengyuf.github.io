<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker notes · DiscoLoop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  /* presenter window: opened from the deck with S; keep it on the laptop screen */
  :root {
    --bg: #0e1116; --panel: #161b23; --line: #2a313c; --edge: #c9d1dc; --mute: #8b98ad;
    --amber: #ffb454; --blue: #4aa8ff; --green: #5ad19a;
    --font: "Avenir Next", "Avenir", "Helvetica Neue", Arial, "PingFang SC", sans-serif;
    --fs: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; font-family: var(--font); }
  body { display: grid; grid-template-rows: auto 1fr; }
  header {
    display: flex; align-items: baseline; gap: 22px; padding: 12px 22px; border-bottom: 1px solid var(--line);
    font-size: 18px; color: var(--mute); white-space: nowrap;
  }
  header .slide { color: #fff; font-size: 22px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  header .step b, header .timer b, header .clock b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  header .timer { cursor: pointer; }
  header .timer.paused b { color: var(--amber); }
  header .link { font-size: 15px; }
  header .link.off { color: var(--amber); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
  #notes { overflow-y: auto; padding: 18px 28px 40vh; font-size: var(--fs); line-height: 1.5; color: var(--edge); }
  #notes h1 { font-size: 1.15em; color: #fff; margin: 0 0 12px; font-weight: 600; }
  #notes p { margin: 0 0 12px; }
  #notes p.paper { font-size: 0.8em; color: var(--mute); }
  #notes ul { margin: 0 0 12px; padding-left: 1.2em; }
  #notes li { margin: 5px 0; padding: 2px 8px; border-left: 4px solid transparent; border-radius: 4px; }
  #notes li li { margin: 3px 0; }
  #notes strong { color: #fff; }
  #notes code { font-size: 0.85em; color: var(--mute); }
  #notes .now { border-left-color: var(--amber); background: rgba(255, 180, 84, 0.10); color: #fff; }
  #notes .empty { color: var(--mute); font-style: italic; }
  aside { border-left: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
  aside .label { font-size: 14px; color: var(--mute); letter-spacing: 1px; text-transform: uppercase; }
  .preview { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .preview .end { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--mute); font-size: 16px; }
  .preview.done .end { display: flex; }
  .preview.done iframe { visibility: hidden; }
  #nextinfo { font-size: 16px; color: var(--edge); line-height: 1.4; }
  .buttons { display: flex; gap: 10px; }
  button {
    flex: 1; font: inherit; font-size: 17px; color: #fff; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 0; cursor: pointer;
  }
  button:hover { border-color: var(--mute); }
  .small { display: flex; gap: 8px; }
  .small button { font-size: 15px; padding: 6px 0; }
  .keys { font-size: 13px; color: var(--mute); line-height: 1.5; margin-top: auto; }
</style>
</head>
<body>
<header>
  <span class="slide" id="slide">waiting for the deck…</span>
  <span class="step" id="step"></span>
  <span class="timer" id="timer" title="click: pause / resume · R: reset">⏱ <b>00:00</b></span>
  <span class="clock" id="clock"><b></b></span>
  <span class="link off" id="link">not connected</span>
</header>
<main>
  <section id="notes"></section>
  <aside>
    <div class="label">Next click shows</div>
    <div class="preview" id="preview"><iframe id="frame" title="next step" tabindex="-1"></iframe><div class="end">end of the deck</div></div>
    <div id="nextinfo"></div>
    <div class="buttons"><button id="prev">◀ Back</button><button id="next">Next ▶</button></div>
    <div class="small"><button id="smaller">A−</button><button id="bigger">A+</button></div>
    <div class="keys">→ / Space / PageDown: next · ← / PageUp: back · Home / End<br>+ / −: text size · R: reset timer · click the timer to pause</div>
  </aside>
</main>

<script src="notes_data.js"></script>
<script>
(() => {
  "use strict";
  const NOTES = window.NOTES || {};
  const $ = (id) => document.getElementById(id);
  const deck = window.opener;                 // the deck window that opened this one (key S)
  let state = null, lastSeen = 0, shownSlide = 0;

  // ---------------------------------------------------------------- link to the deck
  function send(msg) { if (deck && !deck.closed) deck.postMessage(msg, "*"); }
  function hello() { send({ type: "notes-hello" }); }
  window.addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.type !== "deck-state") return;
    lastSeen = Date.now();
    state = d;
    render();
  });
  setInterval(() => {                         // keep pinging: re-links after a reload of the deck
    hello();
    const ok = Date.now() - lastSeen < 3500;
    $("link").textContent = ok ? "" : (deck ? "not connected: is the deck open?" : "open this window from the deck with S");
    $("link").classList.toggle("off", !ok);
  }, 1500);
  hello();

  // ---------------------------------------------------------------- notes of the current slide
  function title(n) {
    const t = NOTES[String(n)];
    return t && t.title ? t.title : (state && state.ids ? state.ids[n - 1] : "");
  }
  function render() {
    const s = state;
    $("slide").textContent = `${s.slide} / ${s.count} · ${title(s.slide)}`;
    $("step").innerHTML = s.steps > 1 ? `step <b>${s.step}</b> of ${s.steps - 1}` : "";
    const box = $("notes");
    if (shownSlide !== s.slide) {
      const n = NOTES[String(s.slide)];
      box.innerHTML = `<h1>${s.slide} · ${escapeHtml(title(s.slide))}</h1>` +
        (n && n.html ? n.html : '<p class="empty">(no notes for this slide)</p>');
      box.scrollTop = 0;
      shownSlide = s.slide;
    }
    let first = null;
    box.querySelectorAll("[data-steps]").forEach((el) => {
      const [a, b] = el.dataset.steps.split("-").map(Number);
      const on = s.step >= a && s.step <= b;
      el.classList.toggle("now", on);
      if (on && !first) first = el;
    });
    if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });

    // what the next click will show
    let ns = s.slide, nk = s.step + 1;
    if (nk > s.steps - 1) { ns = s.slide + 1; nk = 0; }
    const done = ns > s.count;
    $("preview").classList.toggle("done", done);
    if (!done) {
      preview(ns, nk);
      $("nextinfo").innerHTML = ns === s.slide
        ? `step ${nk} of ${s.steps - 1} on this slide`
        : `<b>next slide:</b> ${ns} · ${escapeHtml(title(ns))}`;
    } else {
      $("nextinfo").textContent = "";
    }
  }
  function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

  // ---------------------------------------------------------------- preview (a second, muted deck)
  const frame = $("frame");
  let frameReady = false, pending = null;
  frame.addEventListener("load", () => { frameReady = true; if (pending) preview(...pending); });
  frame.src = "index.html?preview#1/0";
  function preview(slide, step) {
    pending = [slide, step];
    if (frameReady) frame.contentWindow.postMessage({ type: "preview-goto", slide, step }, "*");
  }

  // ---------------------------------------------------------------- controls
  const nav = (dir) => send({ type: "notes-nav", dir });
  $("next").onclick = () => nav("next");
  $("prev").onclick = () => nav("prev");
  let fs = parseFloat(localStorage.getItem("notes-fs")) || 22;
  const setFs = (v) => { fs = Math.max(14, Math.min(40, v)); document.documentElement.style.setProperty("--fs", fs + "px"); localStorage.setItem("notes-fs", fs); };
  setFs(fs);
  $("smaller").onclick = () => setFs(fs - 2);
  $("bigger").onclick = () => setFs(fs + 2);
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case "ArrowRight": case "ArrowDown": case " ": case "PageDown": case "Enter": e.preventDefault(); nav("next"); break;
      case "ArrowLeft": case "ArrowUp": case "PageUp": case "Backspace": e.preventDefault(); nav("prev"); break;
      case "Home": e.preventDefault(); nav("first"); break;
      case "End": e.preventDefault(); nav("last"); break;
      case "+": case "=": setFs(fs + 2); break;
      case "-": case "_": setFs(fs - 2); break;
      case "r": case "R": t0 = Date.now(); acc = 0; break;
      default: break;
    }
  });

  // ---------------------------------------------------------------- timer and clock
  let t0 = Date.now(), acc = 0, paused = false;
  $("timer").onclick = () => {
    if (paused) { t0 = Date.now(); paused = false; } else { acc += Date.now() - t0; paused = true; }
    $("timer").classList.toggle("paused", paused);
  };
  const mmss = (ms) => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  setInterval(() => {
    $("timer").querySelector("b").textContent = mmss(acc + (paused ? 0 : Date.now() - t0));
    const d = new Date();
    $("clock").querySelector("b").textContent = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }, 500);
})();
</script>
</body>
</html>
